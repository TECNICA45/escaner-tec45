<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ESCÁNER TEC45</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 8px;
  background: #f2f5f9;
}

h1 {
  font-size: 23px;
  color: #123c70;
  margin: 8px 0 12px;
}

#contenedor {
  width: 100%;
  max-width: 600px;
  margin: auto;
  position: relative;
}

#reader {
  width: 100%;
  background: #111;
  border-radius: 14px;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  display: block;
}

#estado {
  margin: 12px auto;
  font-size: 17px;
  font-weight: bold;
  color: #123c70;
}

#resultado {
  display: none;
  position: absolute;
  z-index: 10;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 94%;
  max-height: 95%;
  overflow-y: auto;
  padding: 18px 10px;
  background: rgba(255,255,255,0.97);
  border: 3px solid #16a34a;
  border-radius: 18px;
  box-shadow: 0 5px 25px #0006;
}

.ok {
  font-size: 48px;
}

.nombre {
  font-size: clamp(24px, 6vw, 40px);
  font-weight: bold;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.grupo {
  font-size: 30px;
  font-weight: bold;
  margin-top: 12px;
}

.uniforme {
  font-size: clamp(27px, 7vw, 43px);
  font-weight: bold;
  color: blue;
  border: 4px solid blue;
  border-radius: 14px;
  padding: 12px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

#error {
  color: #b00020;
  font-weight: bold;
  margin: 10px;
}

button {
  padding: 12px 20px;
  font-size: 17px;
  border: none;
  border-radius: 10px;
  background: #123c70;
  color: white;
}

#reiniciar {
  display: none;
  margin: 10px auto;
}
</style>
</head>

<body>

<h1>📷 ESCÁNER TEC45</h1>

<div id="contenedor">

  <div id="reader"></div>

  <div id="resultado">
    <div class="ok" id="icono">✅</div>
    <div class="nombre" id="nombre"></div>
    <div class="grupo" id="grupo"></div>
    <div class="uniforme" id="uniforme"></div>
  </div>

</div>

<div id="estado">
  Iniciando cámara...
</div>

<div id="error"></div>

<button id="reiniciar"
onclick="reiniciarCamara()">
  Reiniciar cámara
</button>

<script>
const API =
"https://script.google.com/macros/s/AKfycbwngazsMR-6cuX4eCHumHKKiVcKNLQF7lRVUgmvMFiYypm2Fs9yAnIfRZhifCy9EXI/exec";

let scanner = null;
let procesando = false;
let ultimaCurp = "";
let ultimoEscaneo = 0;
let temporizador = null;
let iniciando = false;

const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");
const error = document.getElementById("error");
const reiniciar = document.getElementById("reiniciar");

function validarCURP(texto) {
  return /^[A-Z]{4}\d{6}[HM][A-Z]{5}[A-Z0-9]\d$/.test(texto);
}

function ocultarResultado() {
  resultado.style.display = "none";
}

function mostrarResultado(datos) {
  clearTimeout(temporizador);

  document.getElementById("icono").textContent =
    datos.repetido ? "⚠️" : "✅";

  document.getElementById("nombre").textContent =
    datos.nombre || "";

  document.getElementById("grupo").textContent =
    "Grupo: " + (datos.grupo || "");

  const uniforme =
    document.getElementById("uniforme");

  uniforme.textContent = datos.uniforme || "";

  if (datos.repetido) {
    uniforme.style.color = "#b45309";
    uniforme.style.borderColor = "#b45309";
    resultado.style.borderColor = "#b45309";
  } else {
    uniforme.style.color = "blue";
    uniforme.style.borderColor = "blue";
    resultado.style.borderColor = "#16a34a";
  }

  resultado.style.display = "block";

  temporizador = setTimeout(() => {
    ocultarResultado();
  }, 2500);
}

async function leido(textoQR) {
  const curp = String(textoQR).trim().toUpperCase();
  const ahora = Date.now();

  if (procesando) return;

  if (!validarCURP(curp)) {
    estado.textContent =
      "QR no válido. Se requiere CURP.";
    return;
  }

  if (
    curp === ultimaCurp &&
    ahora - ultimoEscaneo < 5000
  ) {
    return;
  }

  procesando = true;
  estado.textContent = "Consultando alumno...";
  error.textContent = "";

  try {
    const respuesta = await fetch(
      API + "?curp=" + encodeURIComponent(curp),
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error HTTP " + respuesta.status);
    }

    const datos = await respuesta.json();

    if (datos.ok) {
      ultimaCurp = curp;
      ultimoEscaneo = Date.now();

      mostrarResultado(datos);

      estado.textContent = datos.repetido
        ? "⚠️ Asistencia ya registrada"
        : "✅ Alumno registrado. Siguiente credencial.";

      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

    } else {
      estado.textContent =
        datos.mensaje || "No se pudo consultar al alumno";

      error.textContent =
        "Respuesta del sistema: " +
        (datos.mensaje || "Error desconocido");

      console.error("Respuesta de Apps Script:", datos);
    }

  } catch (e) {
    console.error(e);

    estado.textContent =
      "Error al consultar alumno";

    error.textContent =
      "Detalle: " +
      (e.message || "Revise internet e intente nuevamente.");

  } finally {
    procesando = false;
  }
}

async function iniciarScanner() {
  if (iniciando) return;
  iniciando = true;

  estado.textContent = "Activando cámara...";
  error.textContent = "";
  reiniciar.style.display = "none";

  try {
    scanner = new Html5Qrcode("reader", {
      verbose: false,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    });

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 20,

        qrbox: (ancho, alto) => {
          const lado = Math.floor(
            Math.min(ancho, alto) * 0.85
          );

          return {
            width: lado,
            height: lado
          };
        },

        aspectRatio: 1.333333,
        disableFlip: true
      },
      leido,
      () => {}
    );

    estado.textContent =
      "📷 Cámara lista. Acerque la credencial.";

  } catch (e) {
    console.error(e);

    estado.textContent =
      "No se pudo iniciar la cámara";

    error.textContent =
      "Revise los permisos de cámara.";

    reiniciar.style.display = "inline-block";

  } finally {
    iniciando = false;
  }
}

async function reiniciarCamara() {
  if (iniciando) return;

  reiniciar.style.display = "none";
  procesando = false;
  clearTimeout(temporizador);
  ocultarResultado();

  if (scanner) {
    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }

      scanner.clear();

    } catch (e) {
      console.error(e);
    }

    scanner = null;
  }

  await iniciarScanner();
}

iniciarScanner();
</script>

</body>
</html>
